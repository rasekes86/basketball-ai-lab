name: Basketball AI Lab · actualización NBA
on:
  # Primera ronda al acabar los partidos NBA de madrugada.
  # Reintento matinal y recuperación desde nba-health.yml si GitHub
  # retrasa u omite cron. El pipeline es idempotente y protege cuotas y Top 3.
  # UTC: 05:37, 07:11, 09:23, 14:41 y 19:47 todos los dias.
  schedule:
    - cron: '37 5 * * *'
    - cron: '11 7 * * *'
    - cron: '23 9 * * *'
    - cron: '41 14 * * *'
    - cron: '47 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-daily.yml'
      - 'src/basketball_ai_lab/**'
      - 'data/refresh_top3_request.json'
permissions:
  contents: write
concurrency:
  group: basketball-ai-lab-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas básicas previas
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      # Historical ESPN summaries are retrieved in a capped, resumable catch-up.
      # The one-time request file permits only future picks to be replaced.
      - name: Actualizar calendario, escudos, Top 3 y liquidaciones
        env:
          PYTHONPATH: src
          ENABLE_ADVANCED_STATS: 'true'
          # La integración se activa automáticamente al guardar ODDS_API_KEY.
          # Sin secreto, ENABLE_ODDS=false y no se llama al proveedor.
          ENABLE_ODDS: ${{ secrets.ODDS_API_KEY != '' && 'true' || 'false' }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m basketball_ai_lab update --output data --site site/data
      - name: Validar archivos, fechas, escudos y CSV antes de publicar
        env:
          PYTHONPATH: src
        run: python -m basketball_ai_lab doctor --require-live
      - name: Conservar solo archivos del proyecto de baloncesto
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data site/data site/reports
          if git diff --cached --quiet; then
            echo 'NBA: no hay cambios nuevos.'
            exit 0
          fi
          git commit -m 'NBA: actualización experimental y auditoría'
          git pull --rebase origin main
          git push origin HEAD:main
