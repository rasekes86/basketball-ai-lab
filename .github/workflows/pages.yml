name: Basketball AI Lab · publicar web
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Los commits hechos por GITHUB_TOKEN desde nba-daily NO generan push
  # encadenados. workflow_run SI permite publicar los datos actualizados.
  workflow_run:
    workflows:
      - 'Basketball AI Lab · actualización NBA'
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: basketball-ai-lab-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # En workflow_run, el SHA del evento es el del workflow original.
          # Necesitamos la rama actual, incluidos datos que acaba de subir.
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Evita colisiones de artefactos al reejecutar un job.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./site
      # GitHub puede tardar en indexar el artefacto; evitar error transitorio 'no artifact found'.
      - name: Esperar indexación del artefacto de Pages
        run: sleep 12
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
